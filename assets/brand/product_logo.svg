<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="whiteG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="#0a0b12" stroke="#1f2133" stroke-width="8"/>

  <!-- Upper-Left Source Image Frame -->
  <rect x="88" y="88" width="232" height="232" rx="36" fill="none" stroke="url(#whiteG)" stroke-width="40" stroke-linejoin="round"/>
  <!-- Image Focal Node (Sun / Lens) -->
  <circle cx="168" cy="168" r="28" fill="url(#whiteG)"/>

  <!-- Lower-Right Active Transfer Frame / Target WebP Canvas -->
  <rect x="192" y="192" width="232" height="232" rx="44" fill="#0f101d" stroke="url(#purpleG)" stroke-width="40" stroke-linejoin="round"/>

  <!-- Unbroken Directional Transfer Arrow Loop -->
  <!-- Bold transfer arrow inside the destination frame -->
  <path d="M246 308 L366 308 M322 264 L368 308 L322 352" fill="none" stroke="url(#purpleG)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>